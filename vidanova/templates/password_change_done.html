{% extends 'layout.html' %}

{% block title %}Contraseña Actualizada{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 text-center">
            <div class="card shadow border-0 border-top border-5 border-success p-5">
                <div class="mb-3">
                    <i class="bx bxs-check-shield text-success" style="font-size: 4rem;"></i>
                </div>
                <h3 class="fw-bold text-dark">¡Contraseña Actualizada!</h3>
                <p class="text-muted">Tu cambio ha sido procesado correctamente. La próxima vez que inicies sesión deberás usar tu nueva clave.</p>
                
                <div class="mt-4">
                    <a href="{% url 'followup_dashboard' %}" class="btn btn-primary px-5">
                        Volver al Tablero
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
