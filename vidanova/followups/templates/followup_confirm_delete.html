{% extends 'layout.html' %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow border-danger">
                <div class="card-header bg-danger text-white">
                    <h5 class="mb-0"><i class="fas fa-exclamation-triangle me-2"></i>Confirmar Eliminación</h5>
                </div>
                <div class="card-body text-center p-5">
                    <p class="lead">¿Estás seguro de que deseas eliminar este registro?</p>
                    
                    <div class="alert alert-light border">
                        <strong>Paciente:</strong> {{ followup.patient.nombre_completo }}<br>
                        <strong>Procedimiento:</strong> {{ followup.tipo_procedimiento }}
                    </div>

                    <p class="text-muted small">Esta acción no se puede deshacer.</p>

                    <form method="post" class="mt-4">
                        {% csrf_token %}
                        <a href="{% url 'followup_dashboard' %}" class="btn btn-outline-secondary px-4">Cancelar</a>
                        <button type="submit" class="btn btn-danger px-4">Sí, Eliminar</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
